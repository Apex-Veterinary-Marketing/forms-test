# Production deploy: builds the site and publishes dist/ to GitHub Pages.
# Copied from malak-state (see its docs/launch/github-pages-launch.md for the
# full launch runbook: Pages source, PAGES_LIVE, custom domain, DNS, HTTPS).
#
# OFF unless the repo variable PAGES_LIVE is "true" (Settings → Secrets and
# variables → Actions → Variables). Demo site: it is served from the
# github.io/forms-test/ sub-path; the build prefixes every link with it (see
# the configure-pages step and basePathRewrite in astro.config.mjs).
#
# Triggers:
# - push to main: every edit, merge or local push.
# - workflow_run: blog posts from issues. publish-from-issue.yml pushes with
#   GITHUB_TOKEN, and GitHub doesn't start workflows from those pushes, so the
#   deploy hangs off that workflow finishing instead.
# - schedule: the weekly rebuild that releases scheduled posts (first build
#   after their pubDate). Match the weekday to the posts' pubDates.
# - workflow_dispatch: "Run workflow" in the Actions tab re-publishes on demand.
#
# A failed build never deploys, so the live site keeps its last good version.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Publish blog post from issue"]
    types: [completed]
  schedule:
    - cron: "0 13 * * 4" # Thursdays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued one waits rather than cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      vars.PAGES_LIVE == 'true' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Where Pages serves the site: base_path "/forms-test" on github.io, ""
      # once a custom domain is attached. astro.config.mjs (basePathRewrite)
      # prefixes the built site's URLs with it.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
