# Scheduled post release.
# Blog posts are scheduled by their pubDate (src/lib/data/blog.ts):
# a post goes live on the first build after its date. This workflow triggers
# that build every Thursday by calling the hosting provider's deploy hook.
#
# Setup: add the host's build/deploy hook URL (Cloudflare, Netlify,
# Vercel, ...) as the repository secret DEPLOY_HOOK_URL. Without it the job
# skips harmlessly. "Run workflow" in the Actions tab releases on demand.
name: Scheduled post release

on:
  schedule:
    - cron: "0 13 * * 4" # Thursdays 13:00 UTC — match the posts' pubDate weekday
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production rebuild
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL secret not set; skipping."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
